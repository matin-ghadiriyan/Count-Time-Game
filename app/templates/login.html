{% extends 'base.html' %}

{% block title %}ورود — Count Time Game{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <h1 class="auth-title">خوش برگشتی</h1>
            <p class="auth-subtitle">برای پیوستن به بازی وارد حساب خود شو.</p>
        </div>

        <form method="post" class="auth-form" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="username">نام کاربری</label>
                <input id="username" name="username" type="text" required minlength="3" maxlength="32"
                       placeholder="مثلاً matin" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>
                <input id="password" name="password" type="password" required minlength="6"
                       placeholder="••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn--primary btn--block">ورود</button>
        </form>

        <p class="auth-foot">
            حساب نداری؟
            <a href="{{ url_for('pages.register') }}">ثبت‌نام کن</a>
        </p>
    </div>
</section>
{% endblock %}
